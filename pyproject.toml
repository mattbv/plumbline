[project]
name = "plumbline"
version = "0.0.1"
description = "Governed, bitemporal reconciliation between a codebase and the documentation that describes it. Built on Ontolith."
authors = [{ name = "Matheus B. Vicari", email = "matheus.boni.vicari@gmail.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["documentation", "drift", "knowledge-graph", "ontolith", "provenance", "ci"]
classifiers = [
	"Development Status :: 2 - Pre-Alpha",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: Apache Software License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Documentation",
	"Topic :: Software Development :: Quality Assurance",
	"Typing :: Typed",
]

dependencies = [
	# Ontolith isn't on PyPI yet (see PRD §9.5 / ADR-0001) — pinned to the
	# v1.0.0 tag via a direct git reference until it is. Upper-bound <2.0
	# per the PRD's own substrate decision: a major bump needs a deliberate
	# review, not an automatic pickup.
	"ontolith @ git+https://github.com/mattbv/ontolith.git@v1.0.0",
	"typer>=0.12",
	"pydantic>=2.6",
	"tomli>=2.0; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/mattbv/plumbline"
Repository = "https://github.com/mattbv/plumbline"
Issues = "https://github.com/mattbv/plumbline/issues"

[project.scripts]
plumb = "plumbline.interfaces.cli:app"

[project.optional-dependencies]
dev = [
	# Testing
	"pytest>=8.0",
	"pytest-cov>=4.1",
	"hypothesis>=6.98",
	# Quality (same stack as Ontolith, for consistency across the two
	# repositories a contributor is likely to touch together)
	"ruff>=0.2",
	"mypy>=1.8",
	"import-linter>=2.0",
	"interrogate>=1.5",
	# Security
	"bandit>=1.7",
	"pip-audit>=2.7",
	# Tools
	"pre-commit>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumbline"]

[tool.hatch.metadata]
# Ontolith isn't on PyPI yet -- pinned via a direct git reference above
# (see the dependency's own comment). Revisit once it publishes a release.
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# docs/ is prose (the PRD, ADRs) -- it happens to contain fenced Python
# snippets, but it's not project source and shouldn't be reformatted.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# UP037 (drop "unnecessary" quotes on a forward-ref annotation): Ontolith's
# own `Ref["ConceptName"]` genuinely needs the string at runtime -- it's
# evaluated via `Ref.__class_getitem__`, not a normal deferred annotation,
# despite this file using `from __future__ import annotations`. UP037
# doesn't know that and will silently strip the quotes, breaking schema
# compilation at import time with no type error to catch it (confirmed:
# this happened once, from running `ruff check --fix` on
# adapters/ontolith_schema.py -- see its own git history).
ignore = ["UP037"]

[tool.ruff.lint.isort]
known-first-party = ["plumbline"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "--cov=plumbline", "--cov-report=term-missing"]
testpaths = ["tests"]
markers = [
	"integration: exercises a real Ontolith-backed knowledge base, not pure logic",
]

[tool.coverage.run]
source = ["src/plumbline"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-private = true
fail-under = 90
exclude = ["tests", "build"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.importlinter]
root_package = "plumbline"

[[tool.importlinter.contracts]]
name = "Domain must not import application, adapters, or interfaces"
type = "forbidden"
source_modules = ["plumbline.domain"]
forbidden_modules = ["plumbline.application", "plumbline.adapters", "plumbline.interfaces"]

[[tool.importlinter.contracts]]
name = "Application must not import adapters or interfaces (depends on ports only)"
type = "forbidden"
source_modules = ["plumbline.application"]
forbidden_modules = ["plumbline.adapters", "plumbline.interfaces"]

[[tool.importlinter.contracts]]
name = "Layers are ordered: interfaces -> adapters -> application -> domain"
type = "layers"
layers = [
	"plumbline.interfaces",
	"plumbline.adapters",
	"plumbline.application",
	"plumbline.domain",
]
