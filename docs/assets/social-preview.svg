<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Plumbline</title>
  <desc id="d">A plumb line hangs over stacked bars representing code and documentation; one bar is out of line and highlighted as drift.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151B36"/>
      <stop offset="1" stop-color="#0E1226"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Stacked bars: aligned ones share the plumb line's x; one has drifted -->
  <g>
    <rect x="800" y="150" width="300" height="34" rx="4" fill="#2A3470"/>
    <rect x="800" y="200" width="300" height="34" rx="4" fill="#232C60"/>
    <rect x="860" y="250" width="300" height="34" rx="4" fill="none" stroke="#F0A640" stroke-width="3" stroke-dasharray="6 6"/>
    <rect x="800" y="250" width="300" height="34" rx="4" fill="#2A3470" opacity="0.35"/>
    <rect x="800" y="300" width="300" height="34" rx="4" fill="#232C60"/>
    <rect x="800" y="350" width="300" height="34" rx="4" fill="#2A3470"/>
    <rect x="800" y="400" width="300" height="34" rx="4" fill="#232C60"/>
  </g>
  <g fill="#6F81FF">
    <rect x="816" y="163" width="120" height="8" rx="2"/>
    <rect x="816" y="213" width="170" height="8" rx="2"/>
    <rect x="816" y="313" width="140" height="8" rx="2"/>
    <rect x="816" y="363" width="190" height="8" rx="2"/>
    <rect x="816" y="413" width="110" height="8" rx="2"/>
  </g>
  <rect x="876" y="263" width="150" height="8" rx="2" fill="#F0A640"/>

  <!-- Plumb line -->
  <line x1="950" y1="70" x2="950" y2="500" stroke="#A9B4E8" stroke-width="2" stroke-dasharray="3 5"/>
  <circle cx="950" cy="70" r="6" fill="#0E1226" stroke="#A9B4E8" stroke-width="3"/>
  <polygon points="950,500 934,470 966,470" fill="#6F81FF"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="290" font-size="96" font-weight="700" fill="#F2F4FF">Plumbline</text>
    <text x="84" y="350" font-size="30" fill="#A9B4E8">Catch documentation drift.</text>
    <text x="84" y="392" font-size="30" fill="#A9B4E8">Governed, bitemporal, auditable.</text>
  </g>
</svg>
